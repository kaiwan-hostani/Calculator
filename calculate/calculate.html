<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculate</title>
    <link rel="stylesheet" href="calculate.css">
  </head>
  <body>
    <div class="container">
      <div class="calculate">
        <div class="result">
          <P class="text"></P>
        </div>
        <div class="btns">
            <div class="three-part top">
            <div class="ac">
                <button class="btn ac">AC</button>
            </div>    
                <button class="btn back-space">
                  <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-backspace-fill" viewBox="0 0 16 16">
                    <path d="M15.683 3a2 2 0 0 0-2-2h-7.08a2 2 0 0 0-1.519.698L.241 7.35a1 1 0 0 0 0 1.302l4.843 5.65A2 2 0 0 0 6.603 15h7.08a2 2 0 0 0 2-2zM5.829 5.854a.5.5 0 1 1 .707-.708l2.147 2.147 2.146-2.147a.5.5 0 1 1 .707.708L9.39 8l2.146 2.146a.5.5 0 0 1-.707.708L8.683 8.707l-2.147 2.147a.5.5 0 0 1-.707-.708L7.976 8z"/>
                  </svg>
                </button>
                <button class="btn operater divide">/</button>
            </div>
                <div class="numbers">
                <button class="btn number seven">7</button>
                <button class="btn number eight">8</button>
                <button class="btn number nine">9</button>
                <button class="btn operater multy">x</button>
                <button class="btn number four">4</button>
                <button class="btn number five">5</button>
                <button class="btn number six">6</button>
                <button class="btn operater plus">+</button>
                <button class="btn number one">1</button>
                <button class="btn number two">2</button>
                <button class="btn number three">3</button>
                <button class="btn operater minuse">-</button>
            </div>
            <div class="three-part bottom">
               <div class="zero">
                 <button class="btn number zero">0</button>
               </div>
                <button class="btn dot">.</button>
                <button class="btn operater equale">=</button>
            </div>
        </div>
      </div>
    </div>

    <script src="calculate.js"></script>
  </body>
</html>
